server:
  port: 8083

spring:
  application:
    name: ai-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

# OpenAPI & Swagger Configuration (Exposing /api/v1/ai/v3/api-docs)
springdoc:
  api-docs:
    path: /api/v1/ai/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

